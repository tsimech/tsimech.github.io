<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todd Peters – Skills Map</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
      background: #f6f8fa;
      color: #333;
      overflow-x: hidden;
    }

    #page-header {
      padding: 14px 24px;
      background: #fff;
      border-bottom: 1px solid #e1e4e8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #page-header h1 {
      font-size: 1.15em;
      font-weight: 600;
      color: #24292e;
    }

    #page-header a {
      color: #0366d6;
      text-decoration: none;
      font-size: 0.875em;
    }

    #page-header a:hover { text-decoration: underline; }

    #subtitle {
      text-align: center;
      font-size: 0.8em;
      color: #888;
      padding: 10px 0 6px;
      background: #f6f8fa;
    }

    #chart-wrap {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 10px 0 20px;
    }

    #chart-wrap svg {
      cursor: pointer;
    }

    /* Breadcrumb */
    #breadcrumb {
      text-align: center;
      font-size: 0.8em;
      color: #586069;
      padding: 0 0 4px;
      min-height: 1.4em;
    }

    /* Legend */
    #legend {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 20px 28px;
      background: #fff;
      border-top: 1px solid #e1e4e8;
    }

    #legend-row {
      display: flex;
      flex-wrap: wrap;
      gap: 18px 32px;
      justify-content: center;
      align-items: flex-start;
    }

    .legend-section { }

    .legend-section h4 {
      font-size: 0.72em;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #888;
      margin-bottom: 8px;
    }

    .legend-domains {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .legend-domain {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8em;
      color: #444;
    }

    .legend-domain-circle {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-scale {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-scale-bar {
      display: flex;
      gap: 3px;
      align-items: center;
    }

    .legend-scale-bar span {
      display: inline-block;
      border-radius: 50%;
      background: #0366d6;
    }

    .legend-scale-label {
      font-size: 0.75em;
      color: #888;
    }

    /* Tooltip */
    #tooltip {
      position: fixed;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 11px 14px;
      font-size: 12px;
      max-width: 310px;
      pointer-events: none;
      box-shadow: 0 8px 24px rgba(140,149,159,0.25);
      opacity: 0;
      transition: opacity 0.1s;
      z-index: 999;
    }

    #tooltip .t-name {
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 4px;
    }

    #tooltip .t-score {
      margin-bottom: 7px;
    }

    #tooltip .t-score-pip {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 2px;
    }

    #tooltip .t-score-num {
      font-weight: 600;
      font-size: 12px;
    }

    #tooltip .t-score-label {
      color: #888;
      font-size: 11px;
      margin-left: 4px;
    }

    #tooltip .t-desc {
      color: #444;
      line-height: 1.5;
      border-top: 1px solid #f0f0f0;
      padding-top: 7px;
      margin-top: 4px;
    }

    #tooltip .t-roles {
      margin-top: 6px;
      color: #888;
      font-style: italic;
      font-size: 11px;
    }

    /* Circles */
    circle.domain-circle {
      stroke: #fff;
      stroke-width: 2;
    }

    circle.skill-circle {
      stroke: rgba(255,255,255,0.7);
      stroke-width: 1.5;
    }

    circle.root-circle {
      fill: #24292e;
      stroke: #fff;
      stroke-width: 3;
    }

    text.domain-label {
      font-size: 12px;
      font-weight: 700;
      fill: #24292e;
      text-anchor: middle;
      dominant-baseline: auto;
      pointer-events: none;
    }

    text.skill-label {
      font-size: 10.5px;
      font-weight: 600;
      fill: #fff;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
      paint-order: stroke;
      stroke: rgba(0,0,0,0.35);
      stroke-width: 2.5px;
    }

    text.root-label {
      font-size: 13px;
      font-weight: 700;
      fill: #fff;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="page-header">
    <h1>Todd Peters &mdash; Skills Map</h1>
    <a href="https://tsimech.github.io/resume">&#8592; Back to Resume</a>
  </div>
  <div id="subtitle">Click a domain bubble to zoom in &nbsp;&bull;&nbsp; Click background to zoom out &nbsp;&bull;&nbsp; Hover any skill for details</div>
  <div id="breadcrumb">&nbsp;</div>
  <div id="chart-wrap"></div>

  <div id="legend">
    <div id="legend-row">
      <div class="legend-section">
        <h4>Domain</h4>
        <div class="legend-domains" id="domain-legend"></div>
      </div>
      <div class="legend-section">
        <h4>Expertise (circle size)</h4>
        <div class="legend-scale">
          <span class="legend-scale-label">1</span>
          <div class="legend-scale-bar" id="score-legend"></div>
          <span class="legend-scale-label">10 = Expert</span>
        </div>
      </div>
    </div>
  </div>

  <div id="tooltip"></div>

  <script>
  // ── Data ────────────────────────────────────────────────────────────────────
  // value = expertise score 1–10 (drives circle radius via d3.pack)
  const data = {
    name: "Todd Peters",
    children: [
      {
        name: "AI & Search Platforms",
        children: [
          { name: "SOLR / Lucidworks", value: 9,
            desc: "Field weight tuning (5–6 schema fields), query pipeline design, re-ranking with behavioral signals, schema optimization across 10M+ product catalog",
            roles: "TF 2014–2024 · Avantor 2024–2026" },
          { name: "Query Understanding", value: 9,
            desc: "Synonym management (Lucidworks Fusion generator), spell correction, ML-based autocomplete (GA4 frequency, log boosting, decay factor, ghost term filtering)",
            roles: "TF 2010–2024 · Avantor 2024–2026" },
          { name: "Endeca / FAST", value: 8,
            desc: "Legacy enterprise search platforms; led 2 full platform migrations protecting $3B revenue; pre-production A/B testing strategy",
            roles: "TF 2010–2021" },
          { name: "Faceted Navigation", value: 8,
            desc: "Auto-faceting (FAST, Endeca), dynamic attribute filtering, smart facet ordering via customer popularity ranking and sequential engagement linkages",
            roles: "TF 2014–2024" },
          { name: "Platform Migrations", value: 8,
            desc: "FAST→Endeca, Endeca→Lucidworks Fusion; designed pre-production A/B testing; established SLA and post-install performance specs",
            roles: "TF 2010–2024" },
          { name: "Multilingual Search", value: 7,
            desc: "Language-specific analyzers, cross-language synonym lists for recall improvement, URL-based localization; 15 global domains",
            roles: "TF 2014–2024" },
          { name: "Conversational AI / RAG", value: 7,
            desc: "OpenAI agentic framework (function calling), SOLR IR + LLM assessment layer, grounding citations, hallucination mitigation, semantic retrieval pipeline",
            roles: "Avantor 2024–2026" },
          { name: "AEO / GEO", value: 7,
            desc: "AI Overview optimization, LLM citation strategy, Otterly.ai monitoring, generative engine visibility tracking across Google AI Overviews and ChatGPT",
            roles: "Avantor 2024–2026" }
        ]
      },
      {
        name: "Analytics & Measurement",
        children: [
          { name: "A/B Testing", value: 8,
            desc: "Pre/post statistical significance testing, click distribution analysis, pre-production A/B testing frameworks, confidence intervals, sample size planning",
            roles: "TF 2010–2024 · Avantor 2024–2026" },
          { name: "KPI Framework Design", value: 8,
            desc: "Formal metric definitions, calculation methodology, glossary, and reference table; published as org-level artifact used across search and analytics teams",
            roles: "TF 2021–2024" },
          { name: "GA4 / Adobe Analytics", value: 8,
            desc: "GA4 implementation from scratch; human-only signal collection (search box vs. SRP loads); $/click revenue attribution; Omniture logging + dashboard distribution",
            roles: "TF 2010–2024 · Avantor 2024–2026" },
          { name: "Offline Eval (NDCG)", value: 7,
            desc: "NDCG, Precision@K, Recall@K, MRR at multiple depths (top-5, top-10); non-inferiority testing; tradeoff decision modeling across 2,000 high-volume queries",
            roles: "Avantor 2024–2026" },
          { name: "Power BI / Looker", value: 7,
            desc: "ETL via Power Query, DAX formulas (measures, calculate, conditionals), table joins, GA4 integration, dashboard builds for exec and ops audiences",
            roles: "Avantor 2024–2026" },
          { name: "GSC / SEMrush", value: 6,
            desc: "Technical SEO monitoring, crawl health analysis, keyword gap analysis, AI answer engine presence tracking via Otterly.ai",
            roles: "Avantor 2024–2026" }
        ]
      },
      {
        name: "Product Leadership",
        children: [
          { name: "Executive Communication", value: 9,
            desc: "CIO-level funding presentations; VP roadmap reviews; translated complex technical capabilities into executive language; secured phased funding with pre-negotiated resources",
            roles: "TF 2021–2024 · Avantor 2024–2026" },
          { name: "Cross-functional Teams", value: 9,
            desc: "30 members across 6 functions; 5 on/offshore Agile SCRUM dev teams; 3 direct reports; mentored PMs, BAs, SOs, POs; built 6 cross-functional teams over tenure",
            roles: "TF 2021–2024" },
          { name: "$3B Revenue Channel", value: 9,
            desc: "Sole PM for thermofisher.com + fishersci.com; 10M+ complex scientific products across 15 global domains; 95% decision authority for 11+ years",
            roles: "TF 2010–2024" },
          { name: "$14M Revenue Delivery", value: 8,
            desc: "SOLR field weight tuning in 90-day cycle; CIO audit identifying platform gaps; 2% CTR lift validated to statistical significance; presented to VP and Operations",
            roles: "Avantor 2024–2026" },
          { name: "WSJF / Prioritization", value: 8,
            desc: "Weighted Shortest Job First, Business Value frameworks, OKRs; secured CIO approval for $170M 3-year revenue roadmap using project gates",
            roles: "TF 2021–2024 · Avantor 2024–2026" },
          { name: "0-to-1 AI Product", value: 8,
            desc: "AvantorAI/Navigator: rescued failing initiative with paradigm-shifting architecture; launched multilingual US/Canada; recognized by CEO Michael Stubblefield in Q2 2025 earnings call",
            roles: "Avantor 2024–2026" },
          { name: "Agile / SAFe", value: 7,
            desc: "Led TF transition from Agile SCRUM to SAFe; created Jira process flows and sprint structures adopted as SDLC foundation across multiple teams",
            roles: "TF 2010–2024" },
          { name: "Vendor Management", value: 7,
            desc: "Lucidworks, SOLR specialist, chemical structure search, A/B testing partners; solo MSA negotiation through 3-month procurement approval chain",
            roles: "TF 2014–2024 · Avantor 2024–2026" }
        ]
      },
      {
        name: "Technical Skills",
        children: [
          { name: "Python / SQL / VBA", value: 8,
            desc: "VBA expert (Excel, Outlook MAPI, Access GUI + reports); SQL advanced (Oracle production schema at Motorola, ODBC to TF data warehouse, MySQL); Python proficient — 31 years self-taught",
            roles: "All roles" },
          { name: "OpenAI API", value: 7,
            desc: "Agentic framework (function calling), agent state management, RAG pipeline integration, prompt design for grounded and hallucination-mitigated responses",
            roles: "Avantor 2024–2026" },
          { name: "GitHub / Git / VS Code", value: 7,
            desc: "GitHub Copilot power user; version control; AI-assisted development; built and maintained this career site entirely in VS Code",
            roles: "Current" },
          { name: "JavaScript / HTML / CSS", value: 6,
            desc: "Proficient; used for UI work, dashboard integration, and web tooling across multiple projects",
            roles: "Multiple roles" },
          { name: "Database Design", value: 6,
            desc: "Oracle production tablespace/schema at Motorola; ODBC integration to TF enterprise data warehouse; MS Access normalized relational custom apps",
            roles: "Motorola 1999–2003 · TF 2010–2024" }
        ]
      },
      {
        name: "Domain Expertise",
        children: [
          { name: "Life Sciences eComm", value: 10,
            desc: "14+ yrs across TF + Avantor; 10M+ complex scientific products; B2B purchasing workflows at enterprise scale; global multi-domain platforms for researchers and procurement teams",
            roles: "TF 2010–2024 · Avantor 2024–2026" },
          { name: "SEO / Organic Discovery", value: 8,
            desc: "20,000+ SEO landing pages generated via taxonomy improvements and chemical structure search modernization; structured data; organic traffic growth strategies",
            roles: "TF 2014–2024" },
          { name: "Scientific Taxonomy", value: 8,
            desc: "Chemical structure search; CAS ID landing pages; attribute structures for 10M+ products; application and marketing pages; CMS workflows and content governance",
            roles: "TF 2010–2024" },
          { name: "Biochemistry / Chemistry", value: 7,
            desc: "B.S. Portland State University; 3 peer-reviewed publications (Clinical Chemistry, ASHG); Motorola microarray research; P450 genotyping product development",
            roles: "Education + Motorola 1999–2003" },
          { name: "B2B Sales & BD", value: 6,
            desc: ">$1M contracts closed (exclusive/non-exclusive licensing, OEM supply); $1.2M+ BD pipeline; CEO-level outreach to Fortune 500 targets; OEM negotiations",
            roles: "Safe Life 2007–2010" }
        ]
      }
    ]
  };

  // ── Domain colors ────────────────────────────────────────────────────────────
  // Each domain gets a distinct hue; skill leaves inherit with slightly deeper saturation
  const domainColors = {
    "AI & Search Platforms":   "#1a7abf",
    "Analytics & Measurement": "#2a9d6b",
    "Product Leadership":      "#8a4abf",
    "Technical Skills":        "#bf7b2a",
    "Domain Expertise":        "#bf3b4a"
  };

  // Score → expertise label
  function scoreLabel(v) {
    if (v >= 10) return "Expert";
    if (v >= 8)  return "Advanced";
    if (v >= 6)  return "Proficient";
    return "Familiar";
  }

  // ── Dimensions ───────────────────────────────────────────────────────────────
  const SIZE = Math.min(window.innerWidth - 40, 860);

  // ── Build pack layout ────────────────────────────────────────────────────────
  // d3.hierarchy sums leaf values upward so domain + root circles scale accordingly
  const hierarchy = d3.hierarchy(data)
    .sum(d => d.value || 0)
    .sort((a, b) => b.value - a.value);

  const pack = d3.pack()
    .size([SIZE, SIZE])
    .padding(d => d.depth === 0 ? 20 : d.depth === 1 ? 10 : 4);

  const root = pack(hierarchy);

  // ── Track current zoom node ───────────────────────────────────────────────────
  let currentFocus = root;

  // ── SVG ──────────────────────────────────────────────────────────────────────
  const svg = d3.select("#chart-wrap")
    .append("svg")
    .attr("viewBox", `0 0 ${SIZE} ${SIZE}`)
    .attr("width", SIZE)
    .attr("height", SIZE)
    .style("display", "block");

  // Background click → zoom out to root
  svg.on("click", (event) => {
    if (event.target === svg.node() || event.target.tagName === "rect") {
      zoomTo(root);
    }
  });

  // Background rect to catch clicks
  svg.append("rect")
    .attr("width", SIZE).attr("height", SIZE)
    .attr("fill", "transparent");

  // ── Color helper ─────────────────────────────────────────────────────────────
  function nodeColor(d) {
    if (d.depth === 0) return "#24292e";
    // Walk up to find domain ancestor (depth 1)
    let anc = d;
    while (anc.depth > 1) anc = anc.parent;
    const base = domainColors[anc.data.name] || "#555";
    // Leaf: slightly darker + more saturated
    if (d.depth === 2) {
      return d3.color(base).darker(0.35);
    }
    return base;
  }

  // ── Draw circles ─────────────────────────────────────────────────────────────
  const node = svg.selectAll("g.pack-node")
    .data(root.descendants())
    .join("g")
    .attr("class", "pack-node")
    .attr("transform", d => `translate(${d.x},${d.y})`);

  node.append("circle")
    .attr("r", d => d.r)
    .attr("fill", d => nodeColor(d))
    .attr("fill-opacity", d => d.depth === 0 ? 0.95 : d.depth === 1 ? 0.82 : 0.90)
    .attr("class", d => d.depth === 0 ? "root-circle" : d.depth === 1 ? "domain-circle" : "skill-circle")
    .style("cursor", d => d.depth < 2 ? "pointer" : "default")
    .on("click", (event, d) => {
      event.stopPropagation();
      if (d.depth === 0) zoomTo(root);
      else if (d.depth === 1) zoomTo(currentFocus === d ? root : d);
    });

  // ── Labels ───────────────────────────────────────────────────────────────────
  // Domain labels — positioned above (outside) each domain circle
  node.filter(d => d.depth === 1)
    .append("text")
    .attr("class", "domain-label")
    .attr("y", d => -(d.r + 6))
    .style("fill", d => d3.color(domainColors[d.data.name]).darker(0.5))
    .text(d => d.data.name)
    .style("pointer-events", "none");

  // Skill labels — shown only when circle is large enough
  const skillText = node.filter(d => d.depth === 2)
    .append("text")
    .attr("class", "skill-label")
    .style("font-size", d => Math.min(11, Math.max(7, d.r * 0.38)) + "px")
    .text(d => d.data.name)
    .style("pointer-events", "none")
    .style("opacity", d => d.r >= 22 ? 1 : 0);  // show large circles immediately

  // Root label
  node.filter(d => d.depth === 0)
    .append("text")
    .attr("class", "root-label")
    .style("font-size", "14px")
    .text("Todd Peters");

  // ── Tooltip ──────────────────────────────────────────────────────────────────
  const tooltip = d3.select("#tooltip");

  node.filter(d => d.depth === 2)
    .on("mouseover", (event, d) => {
      const color = nodeColor(d);
      const score = d.data.value;
      tooltip.style("opacity", 1).html(`
        <div class="t-name" style="color:${color}">${d.data.name}</div>
        <div class="t-score">
          <span class="t-score-pip" style="background:${color}"></span>
          <span class="t-score-num" style="color:${color}">${score}/10</span>
          <span class="t-score-label">— ${scoreLabel(score)}</span>
        </div>
        <div class="t-desc">${d.data.desc}
          ${d.data.roles ? `<div class="t-roles">${d.data.roles}</div>` : ""}
        </div>
      `);
    })
    .on("mousemove", (event) => {
      const tx = Math.min(event.clientX + 16, window.innerWidth - 330);
      const ty = Math.max(event.clientY - 30, 8);
      tooltip.style("left", tx + "px").style("top", ty + "px");
    })
    .on("mouseout", () => tooltip.style("opacity", 0));

  // ── Zoom ─────────────────────────────────────────────────────────────────────
  function zoomTo(focus) {
    currentFocus = focus;

    // Target view: center + radius of focused node
    const scale = SIZE / (focus.r * 2.15);
    const tx = SIZE / 2 - focus.x * scale;
    const ty = SIZE / 2 - focus.y * scale;

    // Update breadcrumb
    const bc = document.getElementById("breadcrumb");
    if (focus.depth === 0) {
      bc.innerHTML = "&nbsp;";
    } else {
      bc.textContent = "Todd Peters  ›  " + focus.data.name;
    }

    svg.transition().duration(500)
      .on("end", () => {
        skillText.style("opacity", d => {
          const displayR = d.r * scale;
          if (focus.depth === 1) return (d.parent === focus && displayR >= 18) ? 1 : 0;
          return displayR >= 22 ? 1 : 0;  // full view: show large-enough circles
        });
      });

    node.transition().duration(500)
      .attr("transform", d => {
        const nx = (d.x - focus.x) * scale + SIZE / 2;
        const ny = (d.y - focus.y) * scale + SIZE / 2;
        return `translate(${nx},${ny})`;
      });

    node.select("circle").transition().duration(500)
      .attr("r", d => d.r * scale)
      .attr("fill-opacity", d => {
        if (focus.depth > 0 && d.depth === 1 && d !== focus) return 0.35;
        return d.depth === 0 ? 0.95 : d.depth === 1 ? 0.82 : 0.90;
      });

    // Scale domain label positions; hide the focused domain's label (breadcrumb handles it)
    node.filter(d => d.depth === 1).select("text")
      .transition().duration(500)
      .style("opacity", d => (focus.depth === 1 && d === focus) ? 0 : 1)
      .attr("y", d => -(d.r * scale + 6));

    skillText.transition().duration(500)
      .style("font-size", d => {
        const displayR = d.r * scale;
        return Math.min(12, Math.max(8, displayR * 0.3)) + "px";
      });
  }

  // ── Legend ───────────────────────────────────────────────────────────────────
  const domainLegend = document.getElementById("domain-legend");
  Object.entries(domainColors).forEach(([name, color]) => {
    domainLegend.innerHTML += `
      <div class="legend-domain">
        <div class="legend-domain-circle" style="background:${color}"></div>
        <span>${name}</span>
      </div>`;
  });

  const scoreLegend = document.getElementById("score-legend");
  const sizes = [4, 5, 6, 7, 8, 9, 10, 11, 12, 14];
  const labels = ["1","","","","","","","","","10"];
  sizes.forEach((s, i) => {
    scoreLegend.innerHTML += `<span style="width:${s}px;height:${s}px;opacity:${0.4 + i*0.065}"></span>`;
  });

  </script>
</body>
</html>
