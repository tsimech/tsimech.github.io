    // Analytics & Measurement
    "KPI Framework Design": 65, "Adobe Analytics": 65, "GA4": 95,
    "Looker": 95, "Power BI": 95, "A/B Testing": 90, "Offline Eval (NDCG)": 95,
    "SEMrush": 95, "Google Search Console": 95,
    // Product Leadership
    "$3B Revenue Channel": 65, "$14M Revenue Delivery": 95, "0-to-1 AI Product": 95,
    "Agile / Scrum": 65, "WSJF / Prioritization": 90, "Cross-functional Teams": 65,
    "Executive Communication": 90, "SAFe": 65, "Vendor Management": 90,
    // Technical Skills
    "VBA": 80, "GitHub Copilot": 100, "GitHub / Git / VS Code": 100,
    "Database Design": 65, "SQL": 65, "JavaScript / HTML / CSS": 80,
    "Python": 100, "OpenAI API": 95,
    // Domain Expertise
    "Life Sciences eComm": 90, "Scientific Taxonomy": 65, "B2B Sales & BD": 10,
    "SEO / Organic Discovery": 65, "Biochemistry / Chemistry": 5,
    // Site Search UX
    "SRP Design": 90, "Autocomplete": 90, "Browse Navigation": 65,
    "Category Page Design": 65, "Click Analysis": 90, "ML Re-ranking": 90,
    "Behavioral Signals": 90, "No Results Recovery": 90, "Relevance Tuning": 90,
    "Search UX Testing": 90, "Spell Check / DYM": 90, "Personalization": 65
  };

  function getScore(d) {
    return currentMode === 'recency' ? (recencyScores[d.data.name] || 10) : d.data.value;
  }

  function getLabel(score) {
    return currentMode === 'recency' ? recencyLabel(score) : scoreLabel(score);
  }

  // ── Dimensions ───────────────────────────────────────────────────────────────
  const SIZE = Math.min(window.innerWidth - 40, 860);

  // ── Build pack layout ────────────────────────────────────────────────────────
  // d3.hierarchy sums leaf values upward so domain + root circles scale accordingly
  const hierarchy = d3.hierarchy(data)
    .sum(d => d.value || 0)
    .sort((a, b) => b.value - a.value);

  const pack = d3.pack()
    .size([SIZE, SIZE])
    .padding(d => d.depth === 0 ? 20 : d.depth === 1 ? 10 : 4);

  const root = pack(hierarchy);

  function rebuildPack(mode) {
    hierarchy.sum(d => mode === 'expertise' ? (d.value || 0) : (recencyScores[d.name] || 10))
      .sort((a, b) => b.value - a.value);
    pack(hierarchy);
  }

  // ── Track current zoom node ───────────────────────────────────────────────────
  let currentFocus = root;

  // ── SVG ──────────────────────────────────────────────────────────────────────
  const svg = d3.select("#chart-wrap")
    .append("svg")
    .attr("viewBox", `0 0 ${SIZE} ${SIZE}`)
    .attr("width", SIZE)
    .attr("height", SIZE)
    .style("display", "block");

  // Background click → zoom out to root
  svg.on("click", (event) => {
    if (event.target === svg.node() || event.target.tagName === "rect") {
      zoomTo(root);
    }
  });

  // Background rect to catch clicks
  svg.append("rect")
    .attr("width", SIZE).attr("height", SIZE)
    .attr("fill", "transparent");

  // Layer groups: circles first, labels last (SVG paint order = DOM order)
  const gCircles = svg.append("g");
  const gLabels  = svg.append("g").attr("pointer-events", "none");

  // ── Color helper ─────────────────────────────────────────────────────────────
  function nodeColor(d) {
    if (d.depth === 0) return "#134e4a";
    // Walk up to find domain ancestor (depth 1)
    let anc = d;
    while (anc.depth > 1) anc = anc.parent;
    const base = domainColors[anc.data.name] || "#555";
    // Leaf: slightly darker + more saturated
    if (d.depth === 2) {
      return d3.color(base).darker(0.35);
    }
    return base;
  }

  // ── Draw circles ─────────────────────────────────────────────────────────────
  const node = gCircles.selectAll("g.pack-node")
    .data(root.descendants())
    .join("g")
    .attr("class", "pack-node")
    .attr("transform", d => `translate(${d.x},${d.y})`);

  node.append("circle")
    .attr("r", d => d.r)
    .attr("fill", d => nodeColor(d))
    .attr("fill-opacity", d => d.depth === 0 ? 0.95 : d.depth === 1 ? 0.82 : 0.90)
    .attr("class", d => d.depth === 0 ? "root-circle" : d.depth === 1 ? "domain-circle" : "skill-circle")
    .style("cursor", "pointer")
    .on("click", (event, d) => {
      event.stopPropagation();
      if (d.depth === 0) zoomTo(root);
      else if (d.depth === 1) zoomTo(currentFocus === d ? root : d);
      else if (d.depth === 2) zoomTo(currentFocus === d ? d.parent : d);
    });

  // ── Text wrap helper ─────────────────────────────────────────────────────────
  function wrapTextInCircle(textEl, d) {
    const text = d3.select(textEl);
    const maxWidth = d.r * 1.65;
    const lineHeight = 1.2;
    const words = textEl.textContent.trim().split(/\s+/);
    text.text(null);
    const scratch = text.append("tspan").attr("x", 0).attr("opacity", 0);
    const lines = [];
    let cur = [];
    for (const w of words) {
      cur.push(w);
      scratch.text(cur.join(" "));
      if (scratch.node().getComputedTextLength() > maxWidth && cur.length > 1) {
        cur.pop(); lines.push(cur.join(" ")); cur = [w];
      }
    }
    scratch.remove();
    lines.push(cur.join(" "));
    const startDy = -((lines.length - 1) * lineHeight) / 2;
    lines.forEach((ln, i) => {
      text.append("tspan")
        .attr("x", 0)
        .attr("dy", i === 0 ? startDy + "em" : lineHeight + "em")
        .text(ln);
    });
  }

  // ── Labels ───────────────────────────────────────────────────────────────────
  // Domain labels — in a top-level layer so they always paint above all circles
  const domainLabels = gLabels.selectAll("text.domain-label")
    .data(root.descendants().filter(d => d.depth === 1))
    .join("text")
    .attr("class", "domain-label")
    .attr("x", d => d.x)
    .attr("y", d => d.y - d.r - 7)
    .text(d => d.data.name);

  // Skill labels — shown only when circle is large enough
  const skillText = node.filter(d => d.depth === 2)
    .append("text")
    .attr("class", "skill-label")
    .style("font-size", d => Math.min(11, Math.max(7, d.r * 0.38)) + "px")
    .text(d => d.data.name)
    .style("pointer-events", "none")
    .style("opacity", d => d.r >= 22 ? 1 : 0);  // show large circles immediately

  skillText.each(function(d) { wrapTextInCircle(this, d); });

  // Root label
  node.filter(d => d.depth === 0)
    .append("text")
    .attr("class", "root-label")
    .style("font-size", "14px")
    .text("Todd Peters");

  // ── Tooltip ──────────────────────────────────────────────────────────────────
  const tooltip = d3.select("#tooltip");

  node.filter(d => d.depth === 2)
    .on("mouseover", (event, d) => {
      const color = nodeColor(d);
      const score = getScore(d);
      tooltip.style("opacity", 1).html(`
        <div class="t-name" style="color:${color}">${d.data.name}</div>
        <div class="t-score">
          <span class="t-score-pip" style="background:${color}"></span>
          <span class="t-score-num" style="color:${color}">${score}/100</span>
          <span class="t-score-label">— ${getLabel(score)}</span>
        </div>
        <div class="t-desc">${d.data.desc}
          ${d.data.roles ? `<div class="t-roles">${d.data.roles}</div>` : ""}
        </div>
      `);
    })
    .on("mousemove", (event) => {
      const tx = Math.min(event.clientX + 16, window.innerWidth - 330);
      const ty = Math.max(event.clientY - 30, 8);
      tooltip.style("left", tx + "px").style("top", ty + "px");
    })
    .on("mouseout", () => tooltip.style("opacity", 0));

  // ── Zoom ─────────────────────────────────────────────────────────────────────
  function zoomTo(focus) {
    currentFocus = focus;

    // Target view: center + radius of focused node
    const scale = SIZE / (focus.r * 2.15);
    const tx = SIZE / 2 - focus.x * scale;
    const ty = SIZE / 2 - focus.y * scale;

    // Update breadcrumb
    const bc = document.getElementById("breadcrumb");
    if (focus.depth === 0) {
      bc.innerHTML = "&nbsp;";
    } else if (focus.depth === 1) {
      bc.textContent = "Todd Peters  ›  " + focus.data.name;
    } else {
      bc.textContent = "Todd Peters  ›  " + focus.parent.data.name + "  ›  " + focus.data.name;
    }

    // Hide or show skill detail overlay
    const overlay = document.getElementById("skill-detail");
    if (focus.depth === 2) {
      const color = nodeColor(focus);
      const score = getScore(focus);
      overlay.style.borderColor = color;
      overlay.querySelector(".sd-name").style.color = color;
      overlay.querySelector(".sd-name").textContent = focus.data.name;
      overlay.querySelector(".sd-pip").style.background = color;
      overlay.querySelector(".sd-score-num").style.color = color;
      overlay.querySelector(".sd-score-num").textContent = score + "/100";
      overlay.querySelector(".sd-score-label").textContent = "\u2014 " + getLabel(score);
      overlay.querySelector(".sd-desc").textContent = focus.data.desc || "";
      overlay.querySelector(".sd-roles").textContent = focus.data.roles || "";
    }

    svg.transition().duration(500)
      .on("end", () => {
        skillText.style("opacity", d => {
          if (focus.depth === 2) return d === focus ? 0 : 0;  // overlay handles label
          const displayR = d.r * scale;
          if (focus.depth === 1) return (d.parent === focus && displayR >= 18) ? 1 : 0;
          return displayR >= 22 ? 1 : 0;
        });
        if (focus.depth === 2) {
          overlay.style.opacity = "1";
          overlay.style.pointerEvents = "auto";
        } else {
          overlay.style.opacity = "0";
          overlay.style.pointerEvents = "none";
        }
      });

    node.transition().duration(500)
      .attr("transform", d => {
        const nx = (d.x - focus.x) * scale + SIZE / 2;
        const ny = (d.y - focus.y) * scale + SIZE / 2;
        return `translate(${nx},${ny})`;
      });

    node.select("circle").transition().duration(500)
      .attr("r", d => d.r * scale)
      .attr("fill-opacity", d => {
        if (focus.depth === 2) return (d === focus) ? 0.95 : 0.12;
        if (focus.depth > 0 && d.depth === 1 && d !== focus) return 0.35;
        return d.depth === 0 ? 0.95 : d.depth === 1 ? 0.82 : 0.90;
      });

    // Scale domain label positions; hide focused domain label when zoomed in (breadcrumb handles it)
    domainLabels.transition().duration(500)
      .style("opacity", d => (focus.depth >= 1 && d === (focus.depth === 2 ? focus.parent : focus)) ? 0 : 1)
      .attr("x", d => (d.x - focus.x) * scale + SIZE / 2)
      .attr("y", d => (d.y - focus.y) * scale + SIZE / 2 - d.r * scale - 7);

    skillText.transition().duration(500)
      .style("font-size", d => {
        const displayR = d.r * scale;
        return Math.min(12, Math.max(8, displayR * 0.3)) + "px";
      });
  }

  // ── Legend ───────────────────────────────────────────────────────────────────
  const domainLegend = document.getElementById("domain-legend");
  Object.entries(domainColors).forEach(([name, color]) => {
    domainLegend.innerHTML += `
      <div class="legend-domain">
        <div class="legend-domain-circle" style="background:${color}"></div>
        <span>${name}</span>
      </div>`;
  });

  const scoreLegend = document.getElementById("score-legend");
  const sizes = [4, 5, 6, 7, 8, 9, 10, 11, 12, 14];
  const labels = ["1","","","","","","","","","10"];
  sizes.forEach((s, i) => {
    scoreLegend.innerHTML += `<span style="width:${s}px;height:${s}px;opacity:${0.4 + i*0.065}"></span>`;
  });

  // ── Mode toggle ──────────────────────────────────────────────────────────────
  function toggleMode(mode) {
    if (mode === currentMode) return;
    currentMode = mode;
    rebuildPack(mode);

    // Reset to root
    currentFocus = root;
    const overlay = document.getElementById("skill-detail");
    overlay.style.opacity = "0";
    overlay.style.pointerEvents = "none";
    document.getElementById("breadcrumb").innerHTML = "&nbsp;";

    // Animate all nodes to new layout
    node.transition().duration(600)
      .attr("transform", d => `translate(${d.x},${d.y})`);

    node.select("circle").transition().duration(600)
      .attr("r", d => d.r)
      .attr("fill-opacity", d => d.depth === 0 ? 0.95 : d.depth === 1 ? 0.82 : 0.90);

    domainLabels.transition().duration(600)
      .style("opacity", 1)
      .attr("x", d => d.x)
      .attr("y", d => d.y - d.r - 7);

    skillText.transition().duration(600)
      .style("font-size", d => Math.min(11, Math.max(7, d.r * 0.38)) + "px")
      .style("opacity", d => d.r >= 22 ? 1 : 0)
      .on("end", function(d) { wrapTextInCircle(this, d); });

    // Update button states
    document.querySelectorAll(".mode-btn").forEach(b => {
      b.classList.toggle("active", b.dataset.mode === mode);
    });

    // Update subtitle
    const sub = document.getElementById("subtitle");
    if (mode === 'recency') {
      sub.textContent = "Recency: 100 = active daily \u00b7 90 = used at both roles \u00b7 65 = prior role \u00b7 \u226435 = historical  \u00b7  Click a domain to zoom in";
    } else {
      sub.innerHTML = "Click a domain bubble to zoom in &nbsp;&bull;&nbsp; Click background to zoom out &nbsp;&bull;&nbsp; Hover any skill for details";
    }
  }

  document.querySelectorAll(".mode-btn").forEach(btn => {
    btn.addEventListener("click", () => toggleMode(btn.dataset.mode));
  });

  </script>
</body>
</html>
