<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todd Peters – Skills Map</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-R4G8X27L0X"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-R4G8X27L0X');
  </script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
      background: #f0faf9;
      color: #333;
      overflow-x: hidden;
    }

    #page-header {
      padding: 14px 24px;
      background: #fff;
      border-bottom: 1px solid #c3e8e4;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #page-header h1 {
      font-size: 1.15em;
      font-weight: 600;
      color: #134e4a;
    }

    #page-header a {
      color: #0d9488;
      text-decoration: none;
      font-size: 0.875em;
    }

    #page-header a:hover { text-decoration: underline; }

    #mode-toggle {
      display: flex;
      background: #e0f2f1;
      border-radius: 20px;
      padding: 3px;
      gap: 2px;
    }

    .mode-btn {
      padding: 5px 15px;
      border: none;
      border-radius: 17px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      color: #0d9488;
      transition: background 0.18s, color 0.18s;
      line-height: normal;
    }

    .mode-btn.active {
      background: #0d9488;
      color: #fff;
    }

    #subtitle {
      text-align: center;
      font-size: 0.8em;
      color: #5a8a86;
      padding: 10px 0 6px;
      background: #f0faf9;
    }

    #chart-wrap {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 10px 0 20px;
      position: relative;
    }

    #chart-wrap svg {
      cursor: pointer;
    }

    #skill-detail {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(340px, 72%);
      background: rgba(255,255,255,0.96);
      border: 2px solid #0d9488;
      border-radius: 12px;
      padding: 22px 24px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.18);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 10;
    }

    #skill-detail .sd-name {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 6px;
      color: #0d9488;
    }

    #skill-detail .sd-score {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      font-size: 13px;
    }

    #skill-detail .sd-pip {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #0d9488;
      flex-shrink: 0;
    }

    #skill-detail .sd-score-num {
      font-weight: 700;
      color: #0d9488;
    }

    #skill-detail .sd-score-label {
      color: #888;
    }

    #skill-detail .sd-desc {
      font-size: 13px;
      color: #333;
      line-height: 1.6;
      border-top: 1px solid #e0f2f1;
      padding-top: 10px;
      margin-bottom: 8px;
    }

    #skill-detail .sd-roles {
      font-size: 11.5px;
      color: #777;
      font-style: italic;
    }

    /* Breadcrumb */
    #breadcrumb {
      text-align: center;
      font-size: 0.8em;
      color: #2d6a65;
      padding: 0 0 4px;
      min-height: 1.4em;
    }

    /* Legend */
    #legend {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 14px 28px;
      background: #fff;
      border-bottom: 1px solid #c3e8e4;
    }

    #legend-row {
      display: flex;
      flex-wrap: wrap;
      gap: 18px 32px;
      justify-content: center;
      align-items: flex-start;
    }

    .legend-section { }

    .legend-section h4 {
      font-size: 0.72em;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #888;
      margin-bottom: 8px;
    }

    .legend-domains {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .legend-domain {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8em;
      color: #444;
    }

    .legend-domain-circle {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-scale {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-scale-bar {
      display: flex;
      gap: 3px;
      align-items: center;
    }

    .legend-scale-bar span {
      display: inline-block;
      border-radius: 50%;
      background: #0d9488;
    }

    .legend-scale-label {
      font-size: 0.75em;
      color: #888;
    }

    /* Tooltip */
    #tooltip {
      position: fixed;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 11px 14px;
      font-size: 12px;
      max-width: 310px;
      pointer-events: none;
      box-shadow: 0 8px 24px rgba(140,149,159,0.25);
      opacity: 0;
      transition: opacity 0.1s;
      z-index: 999;
    }

    #tooltip .t-name {
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 4px;
    }

    #tooltip .t-score {
      margin-bottom: 7px;
    }

    #tooltip .t-score-pip {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 2px;
    }

    #tooltip .t-score-num {
      font-weight: 600;
      font-size: 12px;
    }

    #tooltip .t-score-label {
      color: #888;
      font-size: 11px;
      margin-left: 4px;
    }

    #tooltip .t-desc {
      color: #444;
      line-height: 1.5;
      border-top: 1px solid #f0f0f0;
      padding-top: 7px;
      margin-top: 4px;
    }

    #tooltip .t-roles {
      margin-top: 6px;
      color: #888;
      font-style: italic;
      font-size: 11px;
    }

    /* Circles */
    circle.domain-circle {
      stroke: #fff;
      stroke-width: 2;
    }

    circle.skill-circle {
      stroke: rgba(255,255,255,0.7);
      stroke-width: 1.5;
    }

    circle.root-circle {
      fill: #134e4a;
      stroke: #fff;
      stroke-width: 3;
    }

    #page-footer {
      text-align: center;
      font-size: 0.75em;
      color: #999;
      padding: 12px 0 18px;
      background: #f0faf9;
    }

    text.domain-label {
      font-size: 15px;
      font-weight: 800;
      fill: #fff;
      text-anchor: middle;
      dominant-baseline: auto;
      pointer-events: none;
      paint-order: stroke;
      stroke: rgba(0,0,0,0.55);
      stroke-width: 3.5px;
      stroke-linejoin: round;
    }

    text.skill-label {
      font-size: 10.5px;
      font-weight: 600;
      fill: #fff;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
      paint-order: stroke;
      stroke: rgba(0,0,0,0.35);
      stroke-width: 2.5px;
    }

    text.root-label {
      font-size: 13px;
      font-weight: 700;
      fill: #fff;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="page-header">
    <h1>Todd Peters: Skills Map</h1>
    <div style="display:flex;align-items:center;gap:16px;">
      <div id="mode-toggle">
        <button class="mode-btn active" data-mode="expertise">Expertise</button>
        <button class="mode-btn" data-mode="recency">Recency</button>
      </div>
      <a href="#" onclick="history.back(); return false;">&#8592; Back</a>
    </div>
  </div>
  <div id="subtitle">Click a domain bubble to zoom in &nbsp;&bull;&nbsp; Click background to zoom out &nbsp;&bull;&nbsp; Hover any skill for details</div>

  <div id="legend">
    <div id="legend-row">
      <div class="legend-section">
        <h4>Domain</h4>
        <div class="legend-domains" id="domain-legend"></div>
      </div>
      <div class="legend-section">
        <h4>Expertise (circle size)</h4>
        <div class="legend-scale">
          <span class="legend-scale-label">1</span>
          <div class="legend-scale-bar" id="score-legend"></div>
          <span class="legend-scale-label">100 = Expert</span>
        </div>
      </div>
    </div>
  </div>

  <div id="breadcrumb">&nbsp;</div>
  <div id="chart-wrap">
    <div id="skill-detail">
      <div class="sd-name"></div>
      <div class="sd-score">
        <span class="sd-pip"></span>
        <span class="sd-score-num"></span>
        <span class="sd-score-label"></span>
      </div>
      <div class="sd-desc"></div>
      <div class="sd-roles"></div>
    </div>
  </div>

  <div id="tooltip"></div>

  <div id="page-footer">
    &copy; 2026 Todd Peters &nbsp;&bull;&nbsp; Built by me, with <a href="https://tsimech.github.io/skills" style="color:#14b8a6;text-decoration:none;">GitHub Copilot</a>
  </div>

  <script src="skills-data.js"></script>
  <script>
  const data = skillsData;
  const domainColors = skillsDomainColors;

    // Score → expertise label
  function scoreLabel(v) {
    if (v >= 90) return "Expert";
    if (v >= 70) return "Advanced";
    if (v >= 50) return "Proficient";
    return "Familiar";
  }

  // Score → recency label
  function recencyLabel(v) {
    if (v >= 95) return "Active now";
    if (v >= 85) return "Two roles";
    if (v >= 60) return "Prior role";
    return "Historical";
  }

  // Active display mode
  let currentMode = 'expertise';

  const recencyScores = skillsRecencyScores;

    function getScore(d) {
    return currentMode === 'recency' ? (recencyScores[d.data.name] || 10) : d.data.value;
  }

  function getLabel(score) {
    return currentMode === 'recency' ? recencyLabel(score) : scoreLabel(score);
  }

  // ── Dimensions ───────────────────────────────────────────────────────────────
  const SIZE = Math.min(window.innerWidth - 40, 860);

  // ── Build pack layout ────────────────────────────────────────────────────────
  // d3.hierarchy sums leaf values upward so domain + root circles scale accordingly
  const hierarchy = d3.hierarchy(data)
    .sum(d => d.value || 0)
    .sort((a, b) => b.value - a.value);

  const pack = d3.pack()
    .size([SIZE, SIZE])
    .padding(d => d.depth === 0 ? 20 : d.depth === 1 ? 10 : 4);

  const root = pack(hierarchy);

  function rebuildPack(mode) {
    hierarchy.sum(d => mode === 'expertise' ? (d.value || 0) : (recencyScores[d.name] || 10))
      .sort((a, b) => b.value - a.value);
    pack(hierarchy);
  }

  // ── Track current zoom node ───────────────────────────────────────────────────
  let currentFocus = root;

  // ── SVG ──────────────────────────────────────────────────────────────────────
  const svg = d3.select("#chart-wrap")
    .append("svg")
    .attr("viewBox", `0 0 ${SIZE} ${SIZE}`)
    .attr("width", SIZE)
    .attr("height", SIZE)
    .style("display", "block");

  // Background click → zoom out to root
  svg.on("click", (event) => {
    if (event.target === svg.node() || event.target.tagName === "rect") {
      zoomTo(root);
    }
  });

  // Background rect to catch clicks
  svg.append("rect")
    .attr("width", SIZE).attr("height", SIZE)
    .attr("fill", "transparent");

  // Layer groups: circles first, labels last (SVG paint order = DOM order)
  const gCircles = svg.append("g");
  const gLabels  = svg.append("g").attr("pointer-events", "none");

  // ── Color helper ─────────────────────────────────────────────────────────────
  function nodeColor(d) {
    if (d.depth === 0) return "#134e4a";
    // Walk up to find domain ancestor (depth 1)
    let anc = d;
    while (anc.depth > 1) anc = anc.parent;
    const base = domainColors[anc.data.name] || "#555";
    // Leaf: slightly darker + more saturated
    if (d.depth === 2) {
      return d3.color(base).darker(0.35);
    }
    return base;
  }

  // ── Draw circles ─────────────────────────────────────────────────────────────
  const node = gCircles.selectAll("g.pack-node")
    .data(root.descendants())
    .join("g")
    .attr("class", "pack-node")
    .attr("transform", d => `translate(${d.x},${d.y})`);

  node.append("circle")
    .attr("r", d => d.r)
    .attr("fill", d => nodeColor(d))
    .attr("fill-opacity", d => d.depth === 0 ? 0.95 : d.depth === 1 ? 0.82 : 0.90)
    .attr("class", d => d.depth === 0 ? "root-circle" : d.depth === 1 ? "domain-circle" : "skill-circle")
    .style("cursor", "pointer")
    .on("click", (event, d) => {
      event.stopPropagation();
      if (d.depth === 0) zoomTo(root);
      else if (d.depth === 1) zoomTo(currentFocus === d ? root : d);
      else if (d.depth === 2) zoomTo(currentFocus === d ? d.parent : d);
    });

  // ── Text wrap helper ─────────────────────────────────────────────────────────
  function wrapTextInCircle(textEl, d) {
    const text = d3.select(textEl);
    const maxWidth = d.r * 1.65;
    const lineHeight = 1.2;
    const words = textEl.textContent.trim().split(/\s+/);
    text.text(null);
    const scratch = text.append("tspan").attr("x", 0).attr("opacity", 0);
    const lines = [];
    let cur = [];
    for (const w of words) {
      cur.push(w);
      scratch.text(cur.join(" "));
      if (scratch.node().getComputedTextLength() > maxWidth && cur.length > 1) {
        cur.pop(); lines.push(cur.join(" ")); cur = [w];
      }
    }
    scratch.remove();
    lines.push(cur.join(" "));
    const startDy = -((lines.length - 1) * lineHeight) / 2;
    lines.forEach((ln, i) => {
      text.append("tspan")
        .attr("x", 0)
        .attr("dy", i === 0 ? startDy + "em" : lineHeight + "em")
        .text(ln);
    });
  }

  // ── Labels ───────────────────────────────────────────────────────────────────
  // Domain labels — in a top-level layer so they always paint above all circles
  const domainLabels = gLabels.selectAll("text.domain-label")
    .data(root.descendants().filter(d => d.depth === 1))
    .join("text")
    .attr("class", "domain-label")
    .attr("x", d => d.x)
    .attr("y", d => d.y - d.r - 7)
    .text(d => d.data.name);

  // Skill labels — shown only when circle is large enough
  const skillText = node.filter(d => d.depth === 2)
    .append("text")
    .attr("class", "skill-label")
    .style("font-size", d => Math.min(11, Math.max(7, d.r * 0.38)) + "px")
    .text(d => d.data.name)
    .style("pointer-events", "none")
    .style("opacity", d => d.r >= 22 ? 1 : 0);  // show large circles immediately

  skillText.each(function(d) { wrapTextInCircle(this, d); });

  // Root label
  node.filter(d => d.depth === 0)
    .append("text")
    .attr("class", "root-label")
    .style("font-size", "14px")
    .text("Todd Peters");

  // ── Tooltip ──────────────────────────────────────────────────────────────────
  const tooltip = d3.select("#tooltip");

  node.filter(d => d.depth === 2)
    .on("mouseover", (event, d) => {
      const color = nodeColor(d);
      const score = getScore(d);
      tooltip.style("opacity", 1).html(`
        <div class="t-name" style="color:${color}">${d.data.name}</div>
        <div class="t-score">
          <span class="t-score-pip" style="background:${color}"></span>
          <span class="t-score-num" style="color:${color}">${score}/100</span>
          <span class="t-score-label">— ${getLabel(score)}</span>
        </div>
        <div class="t-desc">${d.data.desc}
          ${d.data.roles ? `<div class="t-roles">${d.data.roles}</div>` : ""}
        </div>
      `);
    })
    .on("mousemove", (event) => {
      const tx = Math.min(event.clientX + 16, window.innerWidth - 330);
      const ty = Math.max(event.clientY - 30, 8);
      tooltip.style("left", tx + "px").style("top", ty + "px");
    })
    .on("mouseout", () => tooltip.style("opacity", 0));

  // ── Zoom ─────────────────────────────────────────────────────────────────────
  function zoomTo(focus) {
    currentFocus = focus;

    // Target view: center + radius of focused node
    const scale = SIZE / (focus.r * 2.15);
    const tx = SIZE / 2 - focus.x * scale;
    const ty = SIZE / 2 - focus.y * scale;

    // Update breadcrumb
    const bc = document.getElementById("breadcrumb");
    if (focus.depth === 0) {
      bc.innerHTML = "&nbsp;";
    } else if (focus.depth === 1) {
      bc.textContent = "Todd Peters  ›  " + focus.data.name;
    } else {
      bc.textContent = "Todd Peters  ›  " + focus.parent.data.name + "  ›  " + focus.data.name;
    }

    // Hide or show skill detail overlay
    const overlay = document.getElementById("skill-detail");
    if (focus.depth === 2) {
      const color = nodeColor(focus);
      const score = getScore(focus);
      overlay.style.borderColor = color;
      overlay.querySelector(".sd-name").style.color = color;
      overlay.querySelector(".sd-name").textContent = focus.data.name;
      overlay.querySelector(".sd-pip").style.background = color;
      overlay.querySelector(".sd-score-num").style.color = color;
      overlay.querySelector(".sd-score-num").textContent = score + "/100";
      overlay.querySelector(".sd-score-label").textContent = "\u2014 " + getLabel(score);
      overlay.querySelector(".sd-desc").textContent = focus.data.desc || "";
      overlay.querySelector(".sd-roles").textContent = focus.data.roles || "";
    }

    svg.transition().duration(500)
      .on("end", () => {
        skillText.style("opacity", d => {
          if (focus.depth === 2) return d === focus ? 0 : 0;  // overlay handles label
          const displayR = d.r * scale;
          if (focus.depth === 1) return (d.parent === focus && displayR >= 18) ? 1 : 0;
          return displayR >= 22 ? 1 : 0;
        });
        if (focus.depth === 2) {
          overlay.style.opacity = "1";
          overlay.style.pointerEvents = "auto";
        } else {
          overlay.style.opacity = "0";
          overlay.style.pointerEvents = "none";
        }
      });

    node.transition().duration(500)
      .attr("transform", d => {
        const nx = (d.x - focus.x) * scale + SIZE / 2;
        const ny = (d.y - focus.y) * scale + SIZE / 2;
        return `translate(${nx},${ny})`;
      });

    node.select("circle").transition().duration(500)
      .attr("r", d => d.r * scale)
      .attr("fill-opacity", d => {
        if (focus.depth === 2) return (d === focus) ? 0.95 : 0.12;
        if (focus.depth > 0 && d.depth === 1 && d !== focus) return 0.35;
        return d.depth === 0 ? 0.95 : d.depth === 1 ? 0.82 : 0.90;
      });

    // Scale domain label positions; hide focused domain label when zoomed in (breadcrumb handles it)
    domainLabels.transition().duration(500)
      .style("opacity", d => (focus.depth >= 1 && d === (focus.depth === 2 ? focus.parent : focus)) ? 0 : 1)
      .attr("x", d => (d.x - focus.x) * scale + SIZE / 2)
      .attr("y", d => (d.y - focus.y) * scale + SIZE / 2 - d.r * scale - 7);

    skillText.transition().duration(500)
      .style("font-size", d => {
        const displayR = d.r * scale;
        return Math.min(12, Math.max(8, displayR * 0.3)) + "px";
      });
  }

  // ── Legend ───────────────────────────────────────────────────────────────────
  const domainLegend = document.getElementById("domain-legend");
  Object.entries(domainColors).forEach(([name, color]) => {
    domainLegend.innerHTML += `
      <div class="legend-domain">
        <div class="legend-domain-circle" style="background:${color}"></div>
        <span>${name}</span>
      </div>`;
  });

  const scoreLegend = document.getElementById("score-legend");
  const sizes = [4, 5, 6, 7, 8, 9, 10, 11, 12, 14];
  const labels = ["1","","","","","","","","","10"];
  sizes.forEach((s, i) => {
    scoreLegend.innerHTML += `<span style="width:${s}px;height:${s}px;opacity:${0.4 + i*0.065}"></span>`;
  });

  // ── Mode toggle ──────────────────────────────────────────────────────────────
  function toggleMode(mode) {
    if (mode === currentMode) return;
    currentMode = mode;
    rebuildPack(mode);

    // Reset to root
    currentFocus = root;
    const overlay = document.getElementById("skill-detail");
    overlay.style.opacity = "0";
    overlay.style.pointerEvents = "none";
    document.getElementById("breadcrumb").innerHTML = "&nbsp;";

    // Animate all nodes to new layout
    node.transition().duration(600)
      .attr("transform", d => `translate(${d.x},${d.y})`);

    node.select("circle").transition().duration(600)
      .attr("r", d => d.r)
      .attr("fill-opacity", d => d.depth === 0 ? 0.95 : d.depth === 1 ? 0.82 : 0.90);

    domainLabels.transition().duration(600)
      .style("opacity", 1)
      .attr("x", d => d.x)
      .attr("y", d => d.y - d.r - 7);

    skillText.transition().duration(600)
      .style("font-size", d => Math.min(11, Math.max(7, d.r * 0.38)) + "px")
      .style("opacity", d => d.r >= 22 ? 1 : 0)
      .on("end", function(d) { wrapTextInCircle(this, d); });

    // Update button states
    document.querySelectorAll(".mode-btn").forEach(b => {
      b.classList.toggle("active", b.dataset.mode === mode);
    });

    // Update subtitle
    const sub = document.getElementById("subtitle");
    if (mode === 'recency') {
      sub.textContent = "Recency: 100 = active daily \u00b7 90 = used at both roles \u00b7 65 = prior role \u00b7 \u226435 = historical  \u00b7  Click a domain to zoom in";
    } else {
      sub.innerHTML = "Click a domain bubble to zoom in &nbsp;&bull;&nbsp; Click background to zoom out &nbsp;&bull;&nbsp; Hover any skill for details";
    }
  }

  document.querySelectorAll(".mode-btn").forEach(btn => {
    btn.addEventListener("click", () => toggleMode(btn.dataset.mode));
  });

  </script>
</body>
</html>
